<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Kalam:wght@300;400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. The question -->
<section class="ask" id="ask">
  <div class="ask-inner">
    <h1 id="askQ"></h1>
    <p id="askNote"></p>
    <div class="ask-btns">
      <button id="yes" class="btn primary" type="button"></button>
      <button id="no" class="btn ghost" type="button"></button>
    </div>
  </div>
</section>

<!-- 2. The envelope -->
<div class="env-wrap" id="envelope" role="button" tabindex="0" aria-label="Open the envelope">
  <div class="env">
    <div class="e-back"></div>
    <div class="e-letter"></div>
    <svg class="e-front" viewBox="0 0 300 190" aria-hidden="true">
      <defs>
        <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9e0f4"/><stop offset="1" stop-color="#b6d3ec"/></linearGradient>
        <linearGradient id="gBottom" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d9eaf9"/><stop offset="1" stop-color="#c6def2"/></linearGradient>
      </defs>
      <path d="M0 0 L150 106 L0 190 Z" fill="url(#gSide)"/>
      <path d="M300 0 L150 106 L300 190 Z" fill="url(#gSide)"/>
      <path d="M0 190 L150 98 L300 190 Z" fill="url(#gBottom)"/>
      <path d="M0 190 L150 98 L300 190" fill="none" stroke="#5b86b3" stroke-opacity=".25" stroke-width="1"/>
    </svg>
    <div class="e-addr" id="envTo"></div>
    <svg class="e-flap" viewBox="0 0 300 108" aria-hidden="true">
      <defs><linearGradient id="gFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3d1ec"/><stop offset="1" stop-color="#c2dbf1"/></linearGradient></defs>
      <polygon points="0,0 300,0 150,106" fill="url(#gFlap)" stroke="#5b86b3" stroke-opacity=".25" stroke-linejoin="round"/>
    </svg>
    <div class="seal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.9a4.3 4.3 0 0 1 7.5 2.6c0 5.4-7.5 10-7.5 10Z"/></svg></div>
  </div>
  <p class="hint">Tap to open</p>
</div>

<!-- 3. Letter and photos on the left, bouquet on the right -->
<main class="layout">
  <section class="pane letter-pane">
    <div class="collage">
      <article class="paper">
        <svg class="deco" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <p class="meta" id="letterMeta"></p>
        <h2 id="letterTo"></h2>
        <div id="letterBody"></div>
        <p id="letterFrom"></p>
      </article>
      <aside class="photos" id="photos"></aside>
    </div>
  </section>
  <section class="pane flower-pane" id="flowerPane">
    <div class="bq-wrap"><svg id="bq" viewBox="0 0 480 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
    <div class="petals" id="petals"></div>
    <div class="nameplate"><span id="bouqLabel"></span><strong id="bouqName"></strong><em id="bouqHint"></em></div>
  </section>
</main>

<button id="replay" type="button">Close the envelope</button>
<button id="music" type="button" aria-label="Music on/off" aria-pressed="false"><span class="m-ico">♪</span><span class="m-txt">Music</span></button>
<div id="ytPlayer" aria-hidden="true"></div>
<script src="script.js"></script>
</body>
</html>
